<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254"
     role="img" aria-labelledby="qt qd" style="--q-dur: 2300ms">
  <title id="qt">Quoth</title>
  <desc id="qd">The Quoth mark writing itself: the raven inks in from its tail to
    its head, then the ring unfurls from the body to close at the top.</desc>
